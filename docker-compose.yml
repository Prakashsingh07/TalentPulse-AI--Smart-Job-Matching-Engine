version: '3.8'

services:
  # 1. SQL Server Database Service
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: talentpulse-sqlserver
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=YourSecurePassword123!
    ports:
      - "1433:1433"
    volumes:
      - mssql-data:/var/opt/mssql/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P YourSecurePassword123! -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. .NET 8 Web API Backend Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.backend
    container_name: talentpulse-backend
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Server=sqlserver,1433;Database=TalentPulseDB;User Id=sa;Password=YourSecurePassword123!;TrustServerCertificate=True;MultipleActiveResultSets=true
      - JwtSettings__Secret=TalentPulse_Super_Secret_Production_Key_2026_Enterprise_Secure_Hash
    ports:
      - "5000:5000"
    depends_on:
      sqlserver:
        condition: service_healthy
    restart: always

  # 3. React Frontend Service (Nginx Web Server)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend
    container_name: talentpulse-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: always

volumes:
  mssql-data:
